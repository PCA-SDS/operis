# ==============================================================================
# Operis — production Redis
# ==============================================================================
# This instance carries three workloads: the cache (CACHE_STRATEGY=redis), the
# BullMQ job queues (QUEUE_STRATEGY=async) and the login rate limiter
# (RATE_LIMIT_STRATEGY=redis).
#
# It differs deliberately from the repo's docker/redis/redis.conf, which is a
# dev cache with persistence switched off. Queue jobs are not cache entries:
# losing them on restart loses real work (emails not sent, indexes not built),
# so persistence is ON here.
#
# maxmemory is supplied on the command line (REDIS_MAXMEMORY in .env) because
# redis.conf does not expand environment variables.
# ==============================================================================

# BullMQ requires noeviction: Redis must never silently discard queue state
# under memory pressure. Writes fail loudly instead once maxmemory is reached.
# Watch for that in the app logs and raise REDIS_MAXMEMORY if it happens.
maxmemory-policy noeviction

# Append-only file — the durable option. everysec loses at most one second of
# writes on a hard crash, at negligible cost.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a second line of defence and for fast restarts.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
stop-writes-on-bgsave-error yes

# Not published outside the Docker network, so no password is set here. If you
# ever publish this port, set `requirepass` and add it to every *_REDIS_URL.
protected-mode no
bind 0.0.0.0

# Long-running commands are a red flag in a queue backend.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer for pub/sub (the events bus) — the default 32mb hard
# limit disconnects subscribers during large event bursts.
client-output-buffer-limit pubsub 64mb 32mb 60

tcp-keepalive 300
timeout 0
