# =====================================================================
# Operis production vhost: operis.pca-sds.com
# ---------------------------------------------------------------------
# Loaded by the Operis gateway (deploy/gateway/docker-compose.yml) from
# /opt/operis-gateway/nginx/. Installed by hand; CI never syncs it.
#
# Self-contained: every map and log_format it uses, it defines, under an
# `operis_` prefix. Every file in the gateway renders into ONE http
# context and a duplicate name there is fatal: nginx refuses to start
# and BOTH environments go down. Keep the prefix on anything you add.
# From 00-gateway.conf it inherits only the TLS policy and the resolver.
#
# ORDER OF OPERATIONS. nginx REFUSES TO START when ssl_certificate
# points at a missing file. Always:
#   1. issue the certificate
#   2. install this file
#   3. docker exec operis-gateway-nginx nginx -t      <- must pass
#   4. docker exec operis-gateway-nginx nginx -s reload
#
# Renewal needs nothing: the gateway's certbot renews every certificate
# in its volume twice a day, and nginx reloads every 6 hours.
# =====================================================================

# WebSocket upgrade passthrough.
map $http_upgrade $operis_connection_upgrade {
    default upgrade;
    ''      close;
}

# Query strings are reduced to a marker rather than logged. Operis puts
# single-use credentials in query parameters — password-reset tokens,
# invitation tokens, magic links — and nginx's built-in `combined` format
# would write every one of them to the gateway log in full.
map $args $operis_args {
    default "?<redacted>";
    ""      "";
}

log_format operis_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri$operis_args $server_protocol" '
                         '$status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" rid=$request_id';

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;

    # NOT default_server: 00-gateway.conf holds that and refuses unknown
    # names. This block is selected by SNI/Host match only.
    server_name operis.pca-sds.com;

    ssl_certificate     /etc/letsencrypt/live/operis.pca-sds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operis.pca-sds.com/privkey.pem;

    # TLS protocol/cipher policy is set once in the http context by
    # 00-gateway.conf and applies here too, so it is not repeated.

    access_log /var/log/nginx/access.log operis_access;

    # Attachment uploads. Operis caps these at OM_ATTACHMENT_MAX_UPLOAD_MB
    # (25 MB default); nginx's own default is 1m, which would 413 every
    # upload the app actually allows. Keep this at or above the app cap.
    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # One year, this hostname only. Deliberately no includeSubDomains (this
    # is itself a subdomain of a domain with other hosts on it) and no
    # preload (irreversible for months).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # X-Frame-Options and CSP are NOT set here: Operis's own next.config.ts
    # already sends both. Emitting a second, different value for either is
    # worse than emitting none — browsers resolve conflicting frame policies
    # by taking the most restrictive, and duplicate CSP headers intersect.

    # -----------------------------------------------------------------
    # Build assets. Everything under /_next/static/ is content-hashed and
    # immutable, and Next already sends `Cache-Control: public, max-age=31536000,
    # immutable` for it — this block is about the CONNECTION, not the caching.
    #
    # `location /` below turns proxy_buffering off so RSC payloads stream. That
    # setting is right for documents and wrong for these: the app's production
    # chunks are large (the biggest is several MB, because both minifiers are
    # disabled — see the MikroORM note in apps/mercato/next.config.ts), and with
    # buffering off nginx reads from the upstream only as fast as the client
    # accepts it, so one slow client pins a Node connection for the whole
    # download. Buffering lets nginx take the response at LAN speed, release the
    # upstream connection, and feed the client from its own buffer.
    #
    # A longer prefix wins over `location /` regardless of block order, and the
    # SSE regex above cannot match these paths.
    #
    # Deliberately NO add_header here: a location block that sets any add_header
    # stops inheriting the server-level ones, which would silently drop CSP,
    # HSTS, X-Content-Type-Options and Referrer-Policy from every asset response.
    # -----------------------------------------------------------------
    location /_next/static/ {
        set $upstream_operis http://operis-app:3000;
        proxy_pass         $upstream_operis$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    on;
        # Sized so a typical chunk lands entirely in memory; anything larger
        # spills to nginx's temp files rather than throttling to client speed.
        proxy_buffers      16 64k;
        proxy_buffer_size  32k;
        proxy_busy_buffers_size 128k;

        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }

    # -----------------------------------------------------------------
    # Server-Sent Events — the DOM event bridge, the customer-portal event
    # bridge, and AI chat streaming. nginx buffers proxied responses by
    # default, which holds an SSE frame until the buffer fills: the browser
    # sees nothing for minutes and the feature looks broken rather than slow.
    # These also stay open far longer than a normal request.
    # -----------------------------------------------------------------
    location ~ ^/api/(events/stream|customer_accounts/portal/events/stream|ai_assistant/) {
        set $upstream_operis http://operis-app:3000;
        proxy_pass         $upstream_operis$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Empty Connection header: keeps the upstream connection alive and
        # stops a client-supplied `Connection: close` ending the stream.
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -----------------------------------------------------------------
    # Everything else → the Next.js server.
    #
    # The variable + the http-context `resolver 127.0.0.11` (declared in
    # 00-gateway.conf) mean the upstream is resolved per request, so a
    # redeployed operis-app container is picked up within the resolver's
    # `valid=10s` without reloading nginx. A literal proxy_pass hostname
    # would be resolved once at startup and 502 forever after a deploy.
    #
    # With a variable in proxy_pass nginx no longer appends the matched URI
    # itself, hence the explicit $request_uri (which carries the query
    # string too).
    # -----------------------------------------------------------------
    location / {
        set $upstream_operis http://operis-app:3000;
        proxy_pass         $upstream_operis$request_uri;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $operis_connection_upgrade;

        # Next.js streams React Server Component payloads. Buffering those
        # delays first paint for no benefit on a low-traffic origin.
        proxy_buffering    off;

        # Fail fast while the app container restarts during a deploy: the
        # default 60s connect wait would pin worker connections.
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        # Large uploads stream in slowly on poor connections; don't cut them
        # off mid-body while the client is still sending.
        proxy_send_timeout 90s;
        proxy_request_buffering off;
    }
}
