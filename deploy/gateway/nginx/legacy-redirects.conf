# =====================================================================
# Old faheemkamel.com hostnames: permanent redirect to pca-sds.com
# ---------------------------------------------------------------------
# Keeps bookmarks and links in emails already sent (invitations, record
# links) working after the move. 308 rather than 301 so an API client
# that follows redirects keeps its method and body.
#
# Both old names share one certificate, `operis-legacy`. They also still
# need their DNS A records at Vercel pointing at this host, or renewal
# fails. They carried a one-year HSTS header, so browsers will only ever
# reach them over https: without a valid certificate there is no redirect.
#
# To retire: delete this file, `nginx -t`, reload, then
#   docker exec operis-gateway-certbot certbot delete --cert-name operis-legacy
# and remove the two A records from faheemkamel.com.
# =====================================================================

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name operis.faheemkamel.com;

    ssl_certificate     /etc/letsencrypt/live/operis-legacy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operis-legacy/privkey.pem;

    access_log /var/log/nginx/access.log gateway_access;

    return 308 https://operis.pca-sds.com$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name operis-staging.faheemkamel.com;

    ssl_certificate     /etc/letsencrypt/live/operis-legacy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/operis-legacy/privkey.pem;

    access_log /var/log/nginx/access.log gateway_access;

    return 308 https://staging-operis.pca-sds.com$request_uri;
}
