# =====================================================================
# Operis gateway: http-context policy and the two default servers
# ---------------------------------------------------------------------
# Every file in this directory renders into ONE http context. `map` and
# `log_format` names are global there, and a duplicate is fatal: nginx
# then refuses to start and both environments go down. Names defined here
# are prefixed `gateway_`, production's `operis_`, staging's
# `operis_staging_`. Keep that when adding anything.
#
# The vhosts (operis.conf, operis-staging.conf) inherit the TLS policy and
# the resolver below and deliberately do not repeat them.
# =====================================================================

server_tokens off;

# Docker's embedded DNS. The vhosts put their upstream in a variable, so
# a recreated app container is re-resolved within `valid` instead of
# 502ing until nginx is reloaded.
resolver         127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# Query strings are reduced to a marker, as in the vhosts: a plain-http
# click on a reset or invitation link would otherwise log its token here.
map $args $gateway_args {
    default "?<redacted>";
    ""      "";
}

log_format gateway_access '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri$gateway_args $server_protocol" '
                          '$status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" rid=$request_id';

# :80 for every hostname: ACME HTTP-01 challenges, the container health
# probe, and a redirect to https for everything else. Serving the
# challenge for ANY name is what lets a new hostname get its certificate
# before its vhost exists.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log gateway_access;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 for any name no vhost claims (bare IP, stale DNS records, scanners):
# refuse the TLS handshake instead of answering with an Operis certificate.
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
