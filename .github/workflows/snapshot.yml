name: Develop Snapshot Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [develop]

permissions:
  contents: read

# Serialize snapshot runs per branch — queue rather than cancel.
# cancel-in-progress: false is intentional: cancelling mid-publish would
# leave some packages at the new version and others at the previous one,
# making the npm registry inconsistent. Queuing is the safe behaviour.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish Snapshot
    permissions:
      contents: read
      id-token: write  # required for npm provenance attestation
    outputs:
      snapshot_version: ${{ steps.release.outputs.version }}
      publish_tag: ${{ steps.channel.outputs.publish_tag }}
      packages_json: ${{ steps.release.outputs.packages_json }}
    # GitHub-hosted on purpose — do NOT move this job to a Blacksmith runner.
    # `scripts/publish-packages.sh` publishes with `npm publish --provenance`, and
    # npm's sigstore verification rejects every other runner class:
    #   422 Unprocessable Entity — Error verifying sigstore provenance bundle:
    #   Unsupported GitHub Actions runner environment: "self-hosted".
    # Blacksmith runners register as `self-hosted`, so this job published nothing
    # between #5244 and #5292. Guarded by scripts/__tests__/npm-provenance-runners.test.mjs.
    runs-on: ubuntu-latest
    env:
      YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "access=public" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine snapshot channel
        id: channel
        run: |
          CONFIG=$(node scripts/lib/snapshot-release.mjs config \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}")

          echo "channel=$(echo "$CONFIG" | jq -r '.channel')" >> $GITHUB_OUTPUT
          echo "publish_tag=$(echo "$CONFIG" | jq -r '.publishTag')" >> $GITHUB_OUTPUT
          echo "moving_install_target=$(echo "$CONFIG" | jq -r '.movingInstallTarget')" >> $GITHUB_OUTPUT
          echo "release_kind=$(echo "$CONFIG" | jq -r '.releaseKind')" >> $GITHUB_OUTPUT

      - name: Release snapshot
        id: release
        run: |
          ./scripts/release-snapshot.sh \
            --channel "${{ steps.channel.outputs.channel }}" \
            --tag "${{ steps.channel.outputs.publish_tag }}"

          # Extract published version for downstream jobs
          VERSION=$(jq -r '.version' packages/shared/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Build packages list for PR comment
          PACKAGES_JSON=$(find packages -name package.json -not -path "*/node_modules/*" -exec cat {} \; | \
            jq -s --arg version "$VERSION" \
              '[.[] | select(.private != true and .version == $version) | {name: .name, version: .version}]')

          echo "packages_json<<EOF" >> $GITHUB_OUTPUT
          echo "$PACKAGES_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          PACKAGE_COUNT=$(echo "$PACKAGES_JSON" | jq 'length')
          echo "package_count=$PACKAGE_COUNT" >> $GITHUB_OUTPUT

      - name: Write workflow summary
        if: steps.release.outputs.package_count != '0'
        run: |
          cat > /tmp/packages.json <<'EOF'
          ${{ steps.release.outputs.packages_json }}
          EOF

          {
            echo "## Snapshot Release"
            echo ""
            echo "- Release kind: \`${{ steps.channel.outputs.release_kind }}\`"
            echo "- Dist-tag: \`${{ steps.channel.outputs.publish_tag }}\`"
            echo "- Exact snapshot version: \`${{ steps.release.outputs.version }}\`"

            if [ -n "${{ steps.channel.outputs.moving_install_target }}" ]; then
              echo "- Moving install target: \`${{ steps.channel.outputs.moving_install_target }}\`"
            fi

            echo ""
            echo "| Package | Version |"
            echo "|---------|---------|"
            jq -r '.[] | "| `\(.name)` | `\(.version)` |"' /tmp/packages.json
            echo ""

            if [ -n "${{ steps.channel.outputs.moving_install_target }}" ]; then
              echo "### Moving Develop Channel"
              echo ""
              echo '```bash'
              echo 'yarn add @open-mercato/core@develop'
              echo '```'
              echo ""
            fi

            echo "### Exact Snapshot"
            echo ""
            echo '```bash'
            echo "yarn add @open-mercato/core@${{ steps.release.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The `standalone-integration` job was removed with packages/create-app: it
  # scaffolded a throwaway app with `npx create-mercato-app` against the just-
  # published snapshot. Operis does not publish, so there is nothing to scaffold
  # from. See docs/architecture/upstream-coupling-audit.md.
