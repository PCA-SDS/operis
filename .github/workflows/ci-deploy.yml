name: CI & Deploy

# ==============================================================================
# ONE workflow, one run per push.
# ==============================================================================
#   pull request  ->  quality
#   push to main  ->  quality ─┐
#                     build  ──┴─► deploy
#
# quality and build run CONCURRENTLY and deploy waits for both. Chaining them
# would add the test time to the deploy time for no benefit: a failed test set
# and a successful image build simply mean nothing ships. Wall clock is
# max(quality, build) rather than the sum.
#
# The image is built here, once, and pulled by the server. Building on the VPS
# needs ~4 GB of heap and would compete with the four other production stacks
# sharing that host.
#
# Runners are stock `ubuntu-latest`. Every workflow inherited from upstream
# targets `blacksmith-4vcpu-ubuntu-2404`, a runner fleet this fork has no
# access to — none of them has ever completed a run here. Disable them
# (`gh workflow disable "<name>"`) or they queue and cancel on every push.
# ==============================================================================

on:
  push:
    branches: [main]
    # Docs-only commits on main should not trigger a 40-minute build + deploy.
    # Deliberately NOT applied to pull_request: a PR should always produce a
    # green/red signal, so it can become a required status check later.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'apps/docs/**'
      - '.ai/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to (re)deploy, e.g. sha-1a2b3c4. Empty = build this branch.'
        required: false
        default: ''
      skip_quality:
        description: 'Skip lint/typecheck/tests. Emergency use only.'
        type: boolean
        default: false

# One run at a time per ref. PR runs cancel on a new push (the old result is
# worthless). Runs on main never cancel — killing a deploy halfway through a
# migration is far worse than waiting.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; each job widens only what it needs. This matters
# because the deploy job SHIPS ITS TOKEN to the VPS for a `docker login`. A
# workflow-wide `packages: write` would hand that host a token able to publish
# images to this repository; `packages: read` can only pull.
permissions:
  contents: read

env:
  NODE_VERSION: '24.19.0'
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Decides whether this run needs a container image. Implemented as a job
  # rather than `on.<event>.paths` because that key filters the WHOLE workflow:
  # a docs-only PR must still run lint/typecheck/tests, it just does not need a
  # 10-minute image build. Plain `git diff` on purpose — the header's rule that
  # this workflow stays free of third-party actions applies here too.
  scope:
    name: Decide what to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.decide.outputs.image }}
      translation: ${{ steps.decide.outputs.translation }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge-base is needed to diff a PR against its target.
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The translation image bakes ~2GB of converted model weights into a
          # layer, so it is rebuilt only when the service that defines it
          # changes. Decided BEFORE the early exit below so that both the PR and
          # the push paths emit it - an unset output reads as false, which would
          # silently never rebuild the engine.
          if [ "$EVENT" = "pull_request" ]; then
            TRANSLATION_CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
            # Herestring, not a pipe, for the reason documented below: under
            # pipefail `git diff | grep -q` reports failure ON A MATCH.
            if grep -qE '^services/translation/' <<<"$TRANSLATION_CHANGED"; then
              echo "translation=true"  >> "$GITHUB_OUTPUT"
            else
              echo "translation=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push or manual dispatch: rebuild. The conversion layer is cached in
            # the registry, so an unchanged model is a cache hit rather than a
            # 2GB download.
            echo "translation=true" >> "$GITHUB_OUTPUT"
          fi

          # Anything that is not a PR (push to main, manual dispatch) always
          # builds: that is the artifact that gets deployed.
          if [ "$EVENT" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request - image build required"
            exit 0
          fi

          # Paths that can break `docker build` without breaking lint/tests.
          # Miss one here and main goes red after a green PR, so this list errs
          # toward over-building.
          # Collected first, then matched with a herestring rather than a pipe.
          # `git diff ... | grep -q` is unsafe under `pipefail`: grep exits the
          # instant it matches, git diff takes SIGPIPE and returns 141, and the
          # pipeline reports failure ON A MATCH — silently skipping the image
          # build for exactly the changes that most need it.
          #
          # Every entry below is something the Dockerfile COPYs or `yarn build`
          # reads. The previous list omitted tsconfig*.json (Dockerfile:16),
          # scripts/ (Dockerfile:43-44,52 — `yarn build` runs
          # scripts/build-package.mjs), newrelic.js (Dockerfile:56), the jest
          # configs and eslint.config.mjs (Dockerfile:57-58). A PR touching only
          # those skipped the image build entirely and the first build of that
          # tree happened on main — the exact green-PR/red-main asymmetry this
          # gate exists to prevent.
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          if grep -qE '^(Dockerfile|\.dockerignore|deploy/|docker/|scripts/|package\.json|yarn\.lock|\.yarnrc\.yml|turbo\.json|tsconfig(\.base)?\.json|newrelic\.js|jest\.config\.cjs|jest(\.dom)?\.setup\.ts|eslint\.config\.mjs|apps/mercato/(package\.json|next\.config\.ts)|packages/[^/]+/package\.json)' <<<"$CHANGED"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "image-relevant paths changed - image build required"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "no image-relevant paths changed - skipping image build"
          fi

  # ---------------------------------------------------------------------------
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    # Job-level cap is now a backstop, not the primary guard: every step below
    # carries its own timeout so a hung step fails THAT step with its log
    # attached. The 2026-08-29 incident hung in Typecheck for 45 minutes and
    # then killed the runner ("The hosted runner lost communication with the
    # server"), which discards the log and leaves nothing to diagnose.
    timeout-minutes: 45
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_quality) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable

      - name: Record runner resources
        # Printed unconditionally and cheaply. A runner death is almost always
        # memory or disk, and neither is knowable after the fact without this.
        run: |
          echo "cpus=$(nproc)  mem=$(free -m | awk '/^Mem:/{print $2}')MB"
          df -h / | tail -1

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          # ~/.yarn/berry/cache, NOT .yarn/cache. Yarn 4 defaults
          # `enableGlobalCache: true` and .yarnrc.yml does not override it, so
          # the package zips live in the global folder and `.yarn/cache` never
          # exists in this repo at all. This step therefore cached an absent
          # directory and restored nothing: every run whose node_modules cache
          # missed re-downloaded the full dependency set from npm.
          #
          # The restore-keys line only becomes meaningful with the path fixed.
          # Both this key and the node_modules key hash yarn.lock, so a lockfile
          # change misses BOTH; the prefix fallback is what lets the unchanged
          # majority of packages come from cache instead of the network.
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          # Node version is part of the key: node_modules holds compiled native
          # addons (better-sqlite3, sharp, esbuild), and reusing them across a
          # Node upgrade produces NODE_MODULE_VERSION load failures.
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock') }}

      - name: Cache Turbo outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          # The ref_name segment has to be in the SAVE key for the matching
          # restore-key to work. It previously appeared only in restore-keys,
          # while saves went to `turbo-<os>-<sha>` — so `turbo-<os>-<ref>-`
          # could never prefix-match anything and that line was dead. Only the
          # loose `turbo-<os>-` fallback ever hit.
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-main-
            turbo-${{ runner.os }}-

      - name: Cache Jest transform cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/jest-cache
          # ts-jest transpiles every test file and every module it pulls in.
          # Cold, that dominates the test step; warm, it is close to free.
          key: jest-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ github.ref_name }}-
            jest-${{ runner.os }}-main-
            jest-${{ runner.os }}-

      - name: Install dependencies
        timeout-minutes: 15
        run: yarn install --immutable

      - name: Lint
        # lint:check-graph first: turbo silently reports success when the task
        # graph resolves to zero packages, so a misconfigured filter would make
        # "lint passed" mean "lint never ran".
        timeout-minutes: 15
        run: |
          yarn lint:check-graph
          yarn lint

      - name: Build packages and generate module registries
        # build -> generate -> build is the sequence the Dockerfile and the dev
        # entrypoint both use. The second build is not redundant: `generate`
        # writes packages/core/generated/, and core has to be rebuilt before
        # anything can typecheck against it.
        timeout-minutes: 25
        run: |
          yarn build:packages
          yarn generate
          yarn build:packages

      # Placed after build+generate on purpose: the telemetry guards resolve
      # sibling packages through dist/, and the app guards read files under
      # .mercato/generated/. Running them earlier fails on a clean checkout.
      - name: Run repo-wide audit guards (always, unfiltered)
        # Unconditional on purpose: turbo's filter selects PACKAGES, not paths,
        # so a filtered run silently skips guards that audit files outside the
        # changed package. scripts/repo-wide-guards.mjs is the single
        # enumeration; run `yarn test:repo-wide-guards --list` to see what it
        # currently covers rather than copying the list into this comment.
        timeout-minutes: 10
        run: yarn test:repo-wide-guards

      - name: Run repository script tests
        # Guards over the workflows, Dockerfile and release tooling themselves.
        # These live outside every package, so no turbo task covers them.
        timeout-minutes: 10
        run: yarn test:scripts

      - name: Scan for time bombs
        timeout-minutes: 10
        run: yarn check:time-bombs:fail

      - name: Typecheck
        # typecheck:serial, not typecheck. The root `typecheck` inherits turbo's
        # global concurrency of 32, and TypeScript 7 is the native compiler —
        # each process saturates every core, so 20+ at once thrashes the runner.
        # Serial is not the slow path: the whole repo typechecks in ~13s.
        timeout-minutes: 15
        run: yarn typecheck:serial

      - name: Unit tests
        # Plain `yarn test` now. It runs one PACKAGE at a time (turbo
        # --concurrency=1) while jest uses every core WITHIN that package, so
        # peak process count is bounded at 1 + maxWorkers by construction
        # instead of by a heap flag. The old `test:serial` set
        # NODE_OPTIONS=--max-old-space-size=6144, which Node applies PER
        # PROCESS — jest's main plus its workers — so it asked for up to 18 GB
        # on a 16 GB runner.
        #
        # test:ci wraps `yarn test` with a single retry that fires ONLY when a
        # jest worker died on a fatal signal and no test reported a failure.
        # A real regression fails on assertions and is never retried. The retry
        # is cheap because `test` is a cached turbo task: packages that already
        # passed replay, and only the crashed one runs again.
        timeout-minutes: 30
        env:
          JEST_CACHE_DIR: ${{ runner.temp }}/jest-cache
        run: yarn test:ci

      - name: Diagnose a failed run
        if: failure()
        run: |
          echo "::group::disk"
          df -h
          echo "::endgroup::"
          echo "::group::memory"
          free -m
          echo "::endgroup::"
          echo "::group::kernel OOM kills"
          # The signature of a worker killed by the OOM killer rather than by a
          # failing assertion. Empty output here means memory was NOT the cause.
          sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || echo "none"
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # A PR build never pushes, so it never needs write. Narrowed at runtime
      # is not possible, so this stays `write` and the push itself is gated on
      # the event below.
      packages: write
    needs: [scope, quality]
    # `needs: quality` is new. The header used to argue for running this
    # concurrently so deploy waits on max(quality, build) instead of the sum —
    # correct arithmetic, wrong inputs now. Quality was ~20 minutes when that
    # was written; with a cached test task it is ~5, so gating costs a few
    # minutes of deploy latency and buys back every doomed build. The
    # 2026-08-29 push burned an hour of runner time on an image that could
    # never ship, because quality had already failed 40 minutes earlier.
    #
    # `always()` so an explicitly skipped quality (skip_quality) still builds.
    if: >-
      always()
      && needs.scope.outputs.image == 'true'
      && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      && (github.event_name != 'workflow_dispatch' || inputs.image_tag == '')
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      # 2026-08-29: main went red with "No space left on device" while the PR
      # that introduced the change was green — the PR skips this job unless an
      # image-relevant path changed, so the first build of that tree happened
      # here. Nothing about the image was wrong; a standard runner has ~14 GB
      # free and this build needs more than that once the layer cache misses:
      # yarn install (~440 MiB of packages), a full Next build, the BuildKit
      # layer store, and then `--cache-to mode=max` writing every builder layer
      # out again.
      #
      # The runner ships toolchains this image never uses. Reclaiming them is
      # the cheapest honest fix — it gives the build the headroom it actually
      # needs instead of trimming what the image contains. `|| true` on each
      # path so a future runner image that drops one of these does not fail the
      # build. The df lines stay so the next disk failure is one glance to
      # diagnose rather than an unhandled IOException.
      - name: Reclaim runner disk
        run: |
          set -uo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/local/lib/android || true      # ~9 GB
          sudo rm -rf /usr/share/dotnet || true           # ~1.6 GB
          sudo rm -rf /opt/ghc || true                    # ~1 GB
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          docker image prune -af || true
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

          # Measured 2026-08-30 on this tree: `docker buildx du` reports 10.03 GB
          # of BuildKit store for a single `--target runner` build, before the
          # checkout (~0.5 GB), the `--cache-from` import and the `mode=max`
          # export staging are counted. A stock runner offers ~14 GB free, which
          # is why this build began dying once the registry buildcache filled.
          #
          # Assert the headroom rather than discover its absence as a dead
          # runner. When the runner is killed by ENOSPC the worker cannot even
          # flush its own diagnostic log, so the job reports failure with NO log
          # and NO failed step — the 2026-08-29 outage was invisible for exactly
          # this reason. 20 GB is twice the measured requirement: comfortably
          # above real usage, low enough to fire before the build dies.
          # Falls back to an empty string if a future runner ships a df without
          # --output. A guard must never itself become the thing that breaks the
          # build, so an unreadable measurement warns and continues rather than
          # failing a build that would otherwise have succeeded.
          AVAIL_GB="$(df -B1G --output=avail / 2>/dev/null | tail -1 | tr -dc '0-9')"
          if [ -z "$AVAIL_GB" ]; then
            echo "::warning::could not read available disk; skipping the headroom check"
            AVAIL_GB=999
          fi
          echo "available after reclaim: ${AVAIL_GB}GB"
          if [ "$AVAIL_GB" -lt 20 ]; then
            echo "::error::only ${AVAIL_GB}GB free after reclaiming runner disk; this build needs ~11GB plus cache export headroom."
            echo "::error::The runner image likely changed what it ships. Check the 'disk before'/'disk after' groups above and extend the reclaim list."
            exit 1
          fi

      - name: Compute image coordinates
        id: meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="sha-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          # A PR proves the image still builds; it must not publish a tag or
          # overwrite the shared buildcache, or a broken branch would poison
          # main's cache and `:latest` would point at unreviewed code.
          if [ "$EVENT" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Verifying $IMAGE:$TAG builds (no push)"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Building and pushing $IMAGE:$TAG"
          fi

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Create buildx builder
        # The docker-container driver is what makes --cache-to work. Using the
        # CLI directly keeps this workflow free of third-party actions.
        run: docker buildx create --name operis --driver docker-container --use

      - name: Build and push
        id: build
        timeout-minutes: 50
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          PUSH: ${{ steps.meta.outputs.push }}
        run: |
          set -euo pipefail

          ARGS=(
            --file Dockerfile
            --target runner
            --platform linux/amd64
            --tag "$IMAGE:$TAG"
            --cache-from "type=registry,ref=$IMAGE:buildcache"
            --metadata-file /tmp/build-meta.json
          )

          if [ "$PUSH" = "true" ]; then
            # mode=max, and it has to be. mode=min exports only the layers
            # of the FINAL image — but this builds `--target runner`, a stage
            # that COPYs artifacts out of `builder` rather than containing its
            # layers. Under min, the expensive work (yarn install, then yarn
            # build) never reaches the registry cache at all, and the workflow
            # creates a fresh buildx builder each run so there is no local
            # cache to fall back on: every build would redo ~10 minutes of
            # install and compile even when nothing relevant changed.
            #
            # max costs ~81s of cache export per build and buys back the
            # install layer on every push that does not touch package.json,
            # yarn.lock or turbo.json — which is most pushes. Those three are
            # copied at Dockerfile:15, before `yarn install`, so touching any
            # of them invalidates everything after it and forces a full
            # rebuild regardless of cache mode.
            #
            # ignore-error=true: the cache export runs AFTER the image push, so
            # without it a registry hiccup or a full disk during the export
            # fails the step for an image that already shipped correctly —
            # turning a good release into a red main and a skipped deploy. The
            # cache is an optimisation; losing it must never lose the build.
            ARGS+=(
              --tag "$IMAGE:latest"
              --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,ignore-error=true"
              --push
            )
          else
            # PR: prove it builds, publish nothing, write no cache.
            ARGS+=(--output type=cacheonly)
          fi

          docker buildx build "${ARGS[@]}" .

          if [ "$PUSH" = "true" ]; then
            DIGEST="$(jq -r '."containerimage.digest"' /tmp/build-meta.json)"
          else
            DIGEST=""
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image ${{ steps.meta.outputs.push == 'true' && 'built and pushed' || 'build verified (not pushed)' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  translation-image:
    name: Build and push translation image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    needs: [scope]
    # Built independently of the app image. The weights are baked in at build
    # time, so this layer only changes when the service or its model does — and
    # rebuilding 2GB of converted weights on every application commit would burn
    # runner time for nothing.
    if: >-
      always()
      && needs.scope.result == 'success'
      && needs.scope.outputs.translation == 'true'
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-translation"
          TAG="sha-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login "$REGISTRY" -u '${{ github.actor }}' --password-stdin

      - name: Create buildx builder
        run: docker buildx create --name translation --driver docker-container --use

      - name: Build and push
        id: build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          PUSH: ${{ steps.meta.outputs.push }}
        run: |
          set -euo pipefail
          # The model-conversion stage is the expensive one and changes only when
          # the model id or quantisation does, so the registry cache carries it
          # across builds. `ignore-error` because a cache write failure must not
          # fail a build that otherwise succeeded.
          ARGS=(
            --file services/translation/Dockerfile
            --tag "$IMAGE:$TAG"
            --cache-from "type=registry,ref=$IMAGE:buildcache"
            --progress plain
          )
          if [ "$PUSH" = "true" ]; then
            ARGS+=(--tag "$IMAGE:latest" --push
                   --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,ignore-error=true")
          else
            ARGS+=(--output type=cacheonly)
          fi
          docker buildx build "${ARGS[@]}" services/translation

      - name: Summary
        if: always()
        run: |
          {
            echo "### Translation image ${{ steps.meta.outputs.push == 'true' && 'built and pushed' || 'build verified (not pushed)' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${{ steps.meta.outputs.image }}\` |"
            echo "| tag | \`${{ steps.meta.outputs.tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # read, not write: this token is handed to the VPS to pull the image.
    permissions:
      contents: read
      packages: read
    needs: [scope, quality, build]
    # `always()` so this is evaluated even when a dependency was skipped —
    # without it, one skipped `needs` would skip this job outright. Each result
    # is then checked explicitly: success or skipped is fine, failure is not.
    # skipped is legitimate for `quality` (skip_quality) and for `build`
    # (redeploying an existing tag).
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.scope.result == 'success'
      && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
      && (needs.build.result == 'success'   || needs.build.result == 'skipped')
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag to deploy
        id: tag
        # Both values reach the shell as environment variables, never as
        # interpolated text: a workflow_dispatch input is attacker-controlled
        # from the moment anyone gains write access, and `'${{ ... }}'` inside
        # run: would let a quote character break out into arbitrary commands.
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-$BUILT_TAG}"
          [ -n "$TAG" ] || { echo "::error::no image tag to deploy"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$' \
            || { echo "::error::image tag contains illegal characters"; exit 1; }
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Resolve image to deploy
        id: image
        # The image coordinate is derived HERE and handed to the server, rather
        # than read from a copy kept on the server. github.repository follows a
        # rename or an org transfer automatically; a hand-maintained APP_IMAGE in
        # the VPS's .env does not, and its staleness surfaces only as a failed
        # pull that reads like a registry login problem. One fact, one source.
        env:
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          BUILT_DIGEST: ${{ needs.build.outputs.digest }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # BUILT_IMAGE is empty when the build job was skipped (redeploying an
          # existing tag), so fall back to the same derivation the build uses.
          IMAGE="${BUILT_IMAGE:-${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')}"

          # A digest pins the exact artifact, but only this run's build knows it.
          # Redeploying an arbitrary existing tag has nothing to pin to, so the
          # server is told to skip verification rather than be handed a digest
          # belonging to a different image.
          DIGEST=""
          if [ -n "$BUILT_DIGEST" ] && [ -z "$REQUESTED_TAG" ]; then
            DIGEST="$BUILT_DIGEST"
          fi

          echo "value=$IMAGE"   >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying image: $IMAGE${DIGEST:+  (digest $DIGEST)}"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?DEPLOY_SSH_KEY secret is not set}"
          : "${KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is not set — run: ssh-keyscan -t ed25519 <host>}"
          : "${HOST:?DEPLOY_HOST secret is not set}"
          : "${USERNAME:?DEPLOY_USER secret is not set}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key. StrictHostKeyChecking=accept-new would trust
          # whatever answers on first connect — that is a machine-in-the-middle
          # waiting to happen for a job that carries a deploy key.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Built from shell variables, so nothing from a secret is ever
          # interpolated into this file as workflow text.
          {
            echo "Host target"
            echo "  HostName $HOST"
            echo "  User $USERNAME"
            echo "  Port $PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Verify connectivity
        run: ssh target 'echo "connected as $(id -un)@$(hostname)"; docker version --format "docker {{.Server.Version}}"'

      - name: Sync deployment files
        # Only these six files. The server's .env, backups/ and logs/ are never
        # touched by CI — secrets stay on the server, out of the pipeline.
        #
        # required-env travels with deploy.sh on purpose: it lists the variables
        # this release needs, so adding one is a reviewed change in git rather
        # than something to remember to set on the box afterwards.
        #
        # deploy/nginx/operis.conf.template is deliberately NOT synced. It lives
        # in the pca-erp stack's directory and a bad copy there would break the
        # gateway for four other hostnames, so it is installed by hand, once,
        # behind an `nginx -t`. See deploy/README.md.
        run: |
          set -euo pipefail
          rsync -az --checksum \
            deploy/redis.conf \
            deploy/deploy.sh \
            deploy/backup.sh \
            deploy/required-env \
            deploy/dc \
            target:/opt/operis/
          rsync -az --checksum deploy/docker-compose.prod.yml target:/opt/operis/docker-compose.yml
          ssh target 'chmod +x /opt/operis/deploy.sh /opt/operis/backup.sh /opt/operis/dc'

      - name: Authenticate the server to GHCR (ephemeral)
        # No permanent registry password is stored on the VPS. This is the
        # job-scoped GITHUB_TOKEN, valid only for the life of this run, and the
        # "Revoke" step below removes it again. Piped over stdin so it never
        # lands in the server's argv (readable via /proc by any local user) or
        # in a shell history file.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u $(printf '%q' "$GHCR_USER") --password-stdin"

      - name: Deploy
        # Same rule as the tag step: every value reaches the shell as an
        # environment variable and is quoted with printf %q before it becomes
        # part of a remote command line.
        env:
          TAG: ${{ steps.tag.outputs.value }}
          IMAGE: ${{ steps.image.outputs.value }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          ARGS="$(printf '%q' "$TAG") --image $(printf '%q' "$IMAGE")"
          if [ -n "$DIGEST" ]; then
            ARGS="$ARGS --digest $(printf '%q' "$DIGEST")"
          fi
          ssh target "/opt/operis/deploy.sh $ARGS"

      - name: Smoke test through the public URL
        env:
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          set -euo pipefail
          # Deliberately fatal. Skipping the only external check because a
          # variable is unset reports a green deploy that nothing verified —
          # the one outcome worse than a red one, because it is trusted.
          if [ -z "$DOMAIN" ]; then
            echo "::error::repository variable APP_DOMAIN is not set, so the deploy cannot be verified."
            echo "::error::Set it with: gh variable set APP_DOMAIN --body <hostname>"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://$DOMAIN/api/configs/health" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "health OK: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "::error::$DOMAIN did not return a healthy response after 2 minutes"
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Smoke test the DI container through a real route
        env:
          DOMAIN: ${{ vars.APP_DOMAIN }}
        # /api/configs/health resolves nothing from the Awilix container, so it returns 200
        # from an app whose every `asClass` registration is broken. That is not hypothetical:
        # enabling minification mangled the constructor parameter names CLASSIC injection
        # resolves by, login 500'd, and this deploy still reported healthy.
        #
        # Deliberately WRONG credentials. A 401 proves the container resolved authService and
        # the handler ran; a 5xx proves it could not. No secret is needed to tell those apart,
        # which is what makes this safe to run against production on every deploy.
        run: |
          set -euo pipefail
          if [ -z "$DOMAIN" ]; then
            echo "::error::repository variable APP_DOMAIN is not set, so the deploy cannot be verified."
            exit 1
          fi
          code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' --max-time 20 \
            -X POST "https://$DOMAIN/api/auth/login" \
            -H 'content-type: application/json' \
            --data '{"email":"smoke-test@invalid.local","password":"not-a-real-password"}' || echo 000)"
          case "$code" in
            5*|000)
              echo "::error::POST /api/auth/login returned $code — the app is serving but its DI container or auth path is broken."
              cat /tmp/auth.json 2>/dev/null || true
              exit 1
              ;;
            *)
              echo "auth path OK: rejected bad credentials with HTTP $code"
              ;;
          esac

      - name: Deployment summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.value }}
          DOMAIN: ${{ vars.APP_DOMAIN }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deployment $STATUS"
            echo ""
            echo "- tag: \`$TAG\`"
            echo "- url: https://$DOMAIN"
            echo "- commit: $GITHUB_SHA"
            echo ""
            echo "Roll back with: \`ssh <user>@<host> '/opt/operis/deploy.sh --rollback'\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure details
        if: failure()
        run: |
          echo "::group::deploy log (tail)"
          ssh target 'tail -80 /opt/operis/logs/deploy.log' || true
          echo "::endgroup::"
          echo "::group::container state"
          ssh target '/opt/operis/deploy.sh --status' || true
          echo "::endgroup::"
          echo "::group::app logs"
          ssh target 'cd /opt/operis && ./dc logs --tail 100 app' || true
          echo "::endgroup::"

      - name: Revoke the server's registry credentials
        if: always()
        run: ssh target 'docker logout ghcr.io' || true

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/config
