name: Set up the workspace
description: >-
  Node, Corepack, the three caches and `yarn install` — the identical prologue every
  gate job needs. Local composite action, not a third-party one: the workflow header's
  rule that this pipeline stays free of third-party actions applies here too.

inputs:
  node-version:
    description: Node version to install.
    required: true

  build:
    description: >-
      'true' runs the build → generate → build sequence after installing. Jobs that only
      read source (lint, audit) leave this 'false' and skip ~40s of work they never use.
    required: false
    default: 'false'

  save-cache:
    description: >-
      'true' SAVES the three caches; 'false' restores them read-only. Exactly one job per
      run may save (`prepare`), for two reasons. Redundant: six jobs racing to upload the
      same 2.4 GB node_modules for one key wins nothing, since the first writer takes the
      key and the rest 409. And unsafe: a cache written by a job that ran PR code is
      restorable by later runs, so the number of jobs able to write one is a supply-chain
      surface, not just a performance detail.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}

    - run: corepack enable
      shell: bash

    - name: Record runner resources
      # Printed unconditionally and cheaply. A runner death is almost always memory or
      # disk, and neither is knowable after the fact without this.
      shell: bash
      run: |
        echo "cpus=$(nproc)  mem=$(free -m | awk '/^Mem:/{print $2}')MB"
        df -h / | tail -1

    # ---- Yarn package cache -------------------------------------------------
    # ~/.yarn/berry/cache, NOT .yarn/cache. Yarn 4 defaults `enableGlobalCache: true`
    # and .yarnrc.yml does not override it, so the package zips live in the global
    # folder and `.yarn/cache` never exists in this repo at all.
    - name: Save Yarn package cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - name: Restore Yarn package cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    # ---- node_modules -------------------------------------------------------
    # Node version is part of the key: node_modules holds compiled native addons
    # (better-sqlite3, sharp, esbuild), and reusing them across a Node upgrade
    # produces NODE_MODULE_VERSION load failures.
    - name: Save node_modules
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('yarn.lock') }}

    - name: Restore node_modules
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
        key: node-modules-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('yarn.lock') }}

    # ---- Turbo task cache ---------------------------------------------------
    # The ref_name segment has to be in the SAVE key for the matching restore-key to
    # work. Restore order: this branch's newest, then this branch's older, then main's,
    # then anything — so a fresh branch still inherits main's warm cache.
    - name: Save Turbo cache
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.ref_name }}-
          turbo-${{ runner.os }}-main-
          turbo-${{ runner.os }}-

    - name: Restore Turbo cache
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.ref_name }}-
          turbo-${{ runner.os }}-main-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Build packages and generate module registries
      # build -> generate -> build is the sequence the Dockerfile and the dev entrypoint
      # both use. The second build is not redundant: `generate` writes
      # packages/core/generated/, and core has to be rebuilt before anything can
      # typecheck against it.
      #
      # Cheap in every job but `prepare`: these are cached turbo tasks, so a warm cache
      # replays them in seconds rather than repeating the compile.
      if: inputs.build == 'true'
      shell: bash
      run: |
        yarn build:packages
        yarn generate
        yarn build:packages
