services:
  opencode:
    build:
      context: ./docker/opencode
    image: opencode-mvp
    container_name: mercato-opencode
    restart: unless-stopped
    environment:
      # Unified AI provider/model selection. New deployments set OM_AI_*;
      # the legacy OPENCODE_* variables stay forwarded as a BC fallback so
      # the entrypoint picks them up when OM_AI_* is empty.
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      # Legacy provider selection (anthropic, openai, google) — BC only.
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      # Provider API keys (set the one matching OM_AI_PROVIDER)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      # MCP configuration
      OPENCODE_MCP_URL: ${OPENCODE_MCP_URL:-http://host.docker.internal:3001/mcp}
      MCP_SERVER_API_KEY: ${MCP_SERVER_API_KEY:-}
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mercato-network

  postgres:
    image: pgvector/pgvector:pg17-trixie
    container_name: mercato-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  redis:
    image: redis:7-alpine
    container_name: mercato-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf --maxmemory ${REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: mercato-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  localstack:
    image: localstack/localstack:latest
    container_name: mercato-localstack
    restart: unless-stopped
    profiles:
      - storage-s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localhost
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercato-network

  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: mercato-verdaccio
    restart: unless-stopped
    environment:
      VERDACCIO_PORT: 4873
      VERDACCIO_PUBLIC_URL: http://localhost:4873
    ports:
      - "${VERDACCIO_PORT:-4873}:4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_plugins:/verdaccio/plugins
      - ./config/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4873/-/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  translation:
    build:
      context: ./services/translation
    container_name: mercato-translation
    restart: unless-stopped
    environment:
      TRANSLATION_DEVICE: ${TRANSLATION_DEVICE:-cpu}
      TRANSLATION_COMPUTE_TYPE: ${TRANSLATION_COMPUTE_TYPE:-int8}
    ports:
      # Loopback only. The service has no authentication by design — production
      # reaches it over the internal network and never publishes it — so the
      # default `0.0.0.0` binding here offered a free translation engine to
      # everything on the developer's network.
      - "127.0.0.1:${TRANSLATION_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 10s
      # The first start loads ~2GB of weights; a shorter window reports a
      # healthy service as unhealthy while it is merely still opening.
      start_period: 90s
      retries: 3
    networks:
      - mercato-network

  # ---------------------------------------------------------------------------
  # Matrix chat transport (profile: matrix)
  #
  # Started only by `yarn matrix:up`, never by a bare `docker compose up`, so a
  # developer who is not working on chat transport pays nothing for it.
  #
  # Synapse and Element are AGPL-3.0. They run here as UNMODIFIED upstream
  # images and are spoken to over the Matrix HTTP protocol; no AGPL source
  # enters this repository. See ADR-0006. Both images are pinned: `latest`
  # would let a homeserver upgrade land in the middle of an unrelated branch.
  # ---------------------------------------------------------------------------

  matrix-postgres:
    image: postgres:17-alpine
    container_name: mercato-matrix-postgres
    restart: unless-stopped
    profiles:
      - matrix
    environment:
      POSTGRES_USER: ${MATRIX_PG_USER:-synapse}
      POSTGRES_PASSWORD: ${MATRIX_PG_PASSWORD:-synapse}
      POSTGRES_DB: ${MATRIX_PG_DATABASE:-synapse}
      # Synapse REQUIRES a C-collated database and refuses to start against
      # anything else. Setting it at initdb time is the only moment this can be
      # decided — a running cluster cannot be re-collated.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    # Deliberately its own instance rather than a second database inside
    # mercato-postgres: `yarn db:reset` must never be able to reach it.
    volumes:
      - matrix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATRIX_PG_USER:-synapse} -d ${MATRIX_PG_DATABASE:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mercato-network

  synapse:
    image: ghcr.io/element-hq/synapse:v1.160.0
    container_name: mercato-synapse
    restart: unless-stopped
    profiles:
      - matrix
    depends_on:
      matrix-postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      # Loopback only. Synapse holds every chat message and its client API is
      # authenticated by bearer token; publishing it on 0.0.0.0 would offer that
      # to everything on the developer's network. Same reasoning as `translation`.
      - "127.0.0.1:${MATRIX_SYNAPSE_PORT:-8008}:8008"
    volumes:
      # Rendered config, signing key, appservice registration and media store.
      # Written by `yarn matrix:up`; git-ignored because it holds secrets.
      - ./.matrix-dev/synapse:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      # A fresh database runs the full schema migration before the listener
      # answers. Measured at ~70s on an M-series laptop, so 60s failed the very
      # first `matrix:up` on a clean volume while succeeding on every later one
      # — the worst kind of flake. 180s covers a cold start with headroom.
      start_period: 180s
      retries: 5
    networks:
      - mercato-network

  element:
    image: vectorim/element-web:v1.12.27
    container_name: mercato-element
    restart: unless-stopped
    profiles:
      - matrix
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MATRIX_ELEMENT_PORT:-8009}:80"
    volumes:
      - ./docker/matrix/element/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mercato-network

volumes:
  postgres_data:
    name: mercato-postgres-data
  redis_data:
    name: mercato-redis-data
  meilisearch_data:
    name: mercato-meilisearch-data
  localstack_data:
    name: mercato-localstack-data
  verdaccio_storage:
    name: mercato-verdaccio-storage
  verdaccio_plugins:
    name: mercato-verdaccio-plugins
  matrix_postgres_data:
    name: mercato-matrix-postgres-data

networks:
  mercato-network:
    name: mercato-network
    driver: bridge
